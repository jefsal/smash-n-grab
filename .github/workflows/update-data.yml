name: Update Data

on:
  schedule:
    - cron: "0 11 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh current-month data
        run: python update_data.py

      - name: Commit updated data files
        run: |
          if [ -z "$(git status --porcelain -- current_month_data.csv data_update_metadata.json)" ]; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_month_data.csv data_update_metadata.json
          git commit -m "Update current month crime data"
          git push
